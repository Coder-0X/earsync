name: Build Android APK and Signed AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Signed AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Decode Keystore and Configure Signing
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > earsync-upload.keystore
            cat <<EOF > keystore.properties
          storeFile=earsync-upload.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Keystore and keystore.properties configured successfully."
          else
            echo "Warning: KEYSTORE_BASE64 secret not found."
          fi

      - name: Grant Execute Permission to Gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK (For Testing)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Signed Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Signed Release App Bundle (.aab)
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Copy Artifacts to Staging
        run: |
          mkdir -p build-artifacts
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-artifacts/ \; 2>/dev/null || true
          find android/app/build/outputs/bundle -name "*.aab" -exec cp {} build-artifacts/ \; 2>/dev/null || true
          ls -la build-artifacts/

      - name: Upload APK and AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EarSync-Builds
          path: build-artifacts/*
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.2
          name: "EarSync v1.0.2 (APK & Signed AAB)"
          body: |
            ### 🎧 EarSync v1.0.0 Release
            
            - **`app-debug.apk`** & **`app-release.apk`**: Install directly on your Android phone to test 1-phone dual Bluetooth audio playback.
            - **`app-release.aab`**: Cryptographically signed Android App Bundle ready for Google Play Store upload.
            
            #### Features:
            - Selective Earbuds Checklist (Earbuds 1 & 2)
            - Dual `AudioTrack.setPreferredDevice` synchronization
            - Bluetooth 5.2+ LE Audio Auracast Broadcaster
            - Independent Volume Sliders & Micro-Latency Calibration
            - System Audio Capture (YouTube, Netflix, Spotify)
          files: build-artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
